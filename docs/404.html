<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // SPA redirect for GitHub Pages - redirects all 404s to index.html
  var pathSegmentsToKeep = 1;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    '/firstmind-saass/' +
    l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/\/$/, '') +
    (l.search ? '?' + l.search.slice(1) : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
