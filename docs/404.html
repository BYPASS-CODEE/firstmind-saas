<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FIRSTMIND - Redirecting...</title>
<script>
  // Single Page Apps for GitHub Pages
  // https://github.com/rafgraph/spa-github-pages
  var repo = '/firstmind-saass/';
  var pathSegmentsToKeep = 0;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    repo + l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/\/$/, '/') +
    '?' + l.search.slice(1) +
    l.hash
  );
</script>
</head>
<body></body>
</html>
